<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Panel</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/admin.css" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"/>
</head>
<body>
    <div class="admin-container">
        <h1>Admin Panel</h1>
        <div class="admin-tabs">
            <button class="tab-btn active" data-tab="projects">Projects</button>
            <button class="tab-btn" data-tab="blog">Blog</button>
            <button class="tab-btn" data-tab="messages">Messages</button>
        </div>

        <!-- Projects Tab -->
        <div id="tab-projects" class="tab-content active">
            <div class="admin-actions">
                <button id="add-project-btn" class="btn btn-primary">+ Add Project</button>
            </div>
            <div id="admin-project-grid" class="admin-grid"></div>
        </div>

        <!-- Blog Tab -->
        <div id="tab-blog" class="tab-content">
            <div class="admin-actions">
                <button id="add-blog-btn" class="btn btn-primary">+ Add Blog</button>
            </div>
            <div id="admin-blog-grid" class="admin-grid"></div>
        </div>

        <!-- Messages Tab -->
        <div id="tab-messages" class="tab-content">
            <div id="admin-messages-grid" class="admin-grid"></div>
        </div>
    </div>

    <!-- Add/Edit Modal -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="modal-close">&times;</span>
            <h2 id="modal-title">Add Project</h2>
            <form id="admin-form">
                <input type="hidden" id="edit-id" />
                <input type="text" id="form-title" placeholder="Title" required />
                <textarea id="form-description" placeholder="Description" required></textarea>
                <input type="text" id="form-technologies" placeholder="Technologies (comma separated)" required />
                <select id="form-category">
                    <option value="web">Web</option>
                    <option value="mobile">Mobile</option>
                    <option value="ai">AI</option>
                    <option value="design">Design</option>
                    <option value="other">Other</option>
                </select>
                <input type="text" id="form-liveLink" placeholder="Live Link" />
                <input type="text" id="form-githubLink" placeholder="GitHub Link" />
                <button type="submit" class="btn btn-primary">Save</button>
            </form>
        </div>
    </div>

    <script src="js/admin.js"></script>
</body>
</html>
